events {
    worker_connections 1024;
}

http {

    # ── Load Balancer : 2 instances de matching_service ──
    upstream matching_cluster {
        server 127.0.0.1:8002 weight=1;
        server 127.0.0.1:8012 weight=1;
    }

    # ── (optionnel) upstreams simples pour les autres ──
    upstream auth_cluster {
        server 127.0.0.1:8000;
    }

    upstream user_cluster {
        server 127.0.0.1:8001;
    }

    upstream notif_cluster {
        server 127.0.0.1:8003;
    }

    server {
        listen 80;
        server_name localhost;

        # ── Auth Service ──
        location /api/auth/ {
            proxy_pass         http://auth_cluster;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── User Service ──
        location /api/users/ {
            proxy_pass         http://user_cluster;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── Matching Service (load balanced) ──
        location /api/matching/ {
            proxy_pass         http://matching_cluster;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── Notification Service ──
        location /api/notifications/ {
            proxy_pass         http://notif_cluster;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── Consul UI (optionnel, pratique pour la démo) ──
        location /consul/ {
            proxy_pass http://127.0.0.1:8500/;
        }
    }
}